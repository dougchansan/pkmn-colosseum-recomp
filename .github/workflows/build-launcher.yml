name: Build launcher artifacts

# Builds the ModernGekko launcher, runner and optional mod packages for
# Windows, Linux and macOS.
#
# These artifacts contain NO game data and NO game-derived recomp module.
# Producing a module requires the user's own legally obtained GC6E01 disc
# image, which CI does not have and must never have. Users still run the
# platform setup script locally to generate their own module.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build. On GitHub-hosted runners macOS bills at 10x and Windows at 2x private-repo minutes, so debug on linux first.'
        type: choice
        default: linux
        options: [linux, all, windows, macos]
      runners:
        description: 'self-hosted uses the project machines (no billed minutes); github uses GitHub-hosted runners.'
        type: choice
        default: self-hosted
        options: [self-hosted, github]
      source_ref:
        description: 'Optional source tag or commit to package; defaults to this workflow ref.'
        type: string
        default: ''
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Selecting the matrix here keeps a debug cycle to one cheap Linux runner.
  # On GitHub-hosted runners a full three-platform run costs ~585 billed
  # minutes on a private repo; the self-hosted project machines cost none.
  #
  # Self-hosted runners execute whatever the triggering code says, so they
  # are used only while the repository is private and never for a pull
  # request from a fork. Making the repository public falls back to
  # GitHub-hosted runners (free for public repositories) without an edit.
  plan:
    runs-on: ${{ github.event.repository.private && (inputs.runners || 'self-hosted') == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","pkmn-recomp"]') || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          SELF_HOSTED: ${{ github.event.repository.private && (inputs.runners || 'self-hosted') == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          # dispatch -> caller's choice; PR -> linux only (cheap); tag -> all three.
          sel="${{ github.event_name == 'workflow_dispatch' && inputs.platforms || github.event_name == 'pull_request' && 'linux' || 'all' }}"
          if [ "$SELF_HOSTED" = true ]; then
            linux='{"os":["self-hosted","Linux","pkmn-recomp"],"label":"linux-x86_64","modlib":"mod.so","exe":"","jobs":16}'
            win='{"os":["self-hosted","Windows","pkmn-recomp"],"label":"win64","modlib":"mod.dll","exe":".exe","jobs":8}'
            mac='{"os":["self-hosted","macOS","pkmn-recomp"],"label":"macos-arm64","modlib":"mod.dylib","exe":"","jobs":8}'
          else
            linux='{"os":"ubuntu-latest","label":"linux-x86_64","modlib":"mod.so","exe":"","jobs":4}'
            win='{"os":"windows-latest","label":"win64","modlib":"mod.dll","exe":".exe","jobs":4}'
            mac='{"os":"macos-latest","label":"macos-arm64","modlib":"mod.dylib","exe":"","jobs":4}'
          fi
          echo "runners: $([ "$SELF_HOSTED" = true ] && echo self-hosted || echo github)"
          case "$sel" in
            linux)   inc="[$linux]" ;;
            windows) inc="[$win]" ;;
            macos)   inc="[$mac]" ;;
            *)       inc="[$linux,$win,$mac]" ;;
          esac
          echo "selected: $sel"
          echo "matrix={\"include\":$inc}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true

      - name: Checkout with submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake clang python3 \
            libevdev-dev libudev-dev libsystemd-dev \
            libxi-dev libxrandr-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl-dev libasound2-dev libpulse-dev \
            libbluetooth-dev libcurl4-openssl-dev libusb-1.0-0-dev \
            libgtk-3-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: command -v ninja >/dev/null || brew install ninja

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y
          }

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Verify host patch bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/check-host-patch-bundle.py
          else
            python3 scripts/check-host-patch-bundle.py
          fi

      - name: Apply host patches
        shell: bash
        run: sh mods/host-patches/apply-host-patches.sh "$GITHUB_WORKSPACE/lib/ModernGekko"

      # __FILE__ would otherwise embed the absolute build path into every
      # binary. On a runner that is only /home/runner/work/..., but keeping
      # the trim here means a local build of this same workflow does not leak
      # a developer's username either.
      #
      # The flag is exported as CFLAGS/CXXFLAGS/OBJCFLAGS/OBJCXXFLAGS rather
      # than pasted into -DCMAKE_<LANG>_FLAGS="${{ ... }}": the Windows flag
      # ends in a backslash, which escaped that closing quote and left CMake
      # with mangled C flags and no C++ trim at all. CMake also prepends these
      # variables to its platform defaults (/DWIN32 /D_WINDOWS /EHsc on MSVC)
      # where -DCMAKE_<LANG>_FLAGS would replace them.
      - name: Compute path-trimming flags
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            flag="/d1trimfile:$(cygpath -w "$GITHUB_WORKSPACE")\\"
          else
            flag="-ffile-prefix-map=$GITHUB_WORKSPACE=."
          fi
          echo "trim flag: $flag"
          for var in CFLAGS CXXFLAGS OBJCFLAGS OBJCXXFLAGS; do
            echo "$var=$flag" >> "$GITHUB_ENV"
          done

      # -U drops cached flags so a self-hosted runner's persistent build tree
      # re-reads them from the environment on every run.
      - name: Configure ModernGekko
        shell: bash
        run: |
          cmake -S lib/ModernGekko -B lib/ModernGekko/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -UCMAKE_C_FLAGS -UCMAKE_CXX_FLAGS \
            -UCMAKE_OBJC_FLAGS -UCMAKE_OBJCXX_FLAGS \
            '-DMODERNGEKKO_FRONTEND_NAME=Pokemon Colosseum Recomp' \
            -DMODERNGEKKO_LAUNCHER_OUTPUT_NAME=PokemonColosseumRecomp \
            -DMODERNGEKKO_RUNNER_OUTPUT_NAME=moderngekko-run \
            -DMODERNGEKKO_USER_DIRECTORY_NAME=PokemonColosseumRecomp \
            -DMODERNGEKKO_REQUIRED_DISC_ID=GC6E01 \
            '-DMODERNGEKKO_DEFAULT_WINDOW_TITLE=Pokemon Colosseum Recomp' \
            -DMODERNGEKKO_LOG_FILENAME=PokemonColosseumRecomp.log \
            "-DMODERNGEKKO_DOL_PATCH_MANIFEST=$GITHUB_WORKSPACE/patches/GC6E01-native-widescreen.csv" \
            -DMODERNGEKKO_PORTABLE_DEFAULT_GAME=ON \
            -DMODERNGEKKO_PORTABLE_USER_DIRECTORY=ON \
            -DMODERNGEKKO_GAMECUBE_CONTROLLERS=ON \
            -DMODERNGEKKO_PORT_RELOCATABLE=ON \
            '-DMODERNGEKKO_NATIVE_ULTRAWIDE_MOD_PACKAGE=Mods/Optional/pokemon-colosseum-ultrawide.mgm' \
            '-DMODERNGEKKO_TEXT_UPSCALE_MOD_PACKAGE=Mods/Optional/pokemon-colosseum-hd-text.mgm' \
            '-DMODERNGEKKO_MINIMAP_MOD_PACKAGE=Mods/Optional/pokemon-colosseum-minimap.mgm' \
            '-DMODERNGEKKO_ONLINE_BATTLE_MOD_PACKAGE=Mods/Optional/pokemon-colosseum-online-battle.mgm'

      - name: Build launcher, runner and port tool
        run: >
          cmake --build lib/ModernGekko/build --parallel ${{ matrix.jobs }}
          --target moderngekko-launcher moderngekko-run moderngekko-port

      - name: Build and run ModernGekko tests
        shell: bash
        run: |
          cmake --build lib/ModernGekko/build --parallel ${{ matrix.jobs }}
          ctest --test-dir lib/ModernGekko/build -N -R '^moderngekko\.' | grep -Eq 'Total Tests: [1-9][0-9]*'
          ctest --test-dir lib/ModernGekko/build --output-on-failure -R '^moderngekko\.'

      - name: Build optional mod packages
        shell: bash
        run: |
          cmake -S mods -B build/mods -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -UCMAKE_C_FLAGS -UCMAKE_CXX_FLAGS \
            -UCMAKE_OBJC_FLAGS -UCMAKE_OBJCXX_FLAGS \
            "-DMODERNGEKKO_SOURCE_DIR=$GITHUB_WORKSPACE/lib/ModernGekko"
          cmake --build build/mods --parallel ${{ matrix.jobs }}

      - name: Assemble package
        shell: bash
        run: |
          set -eu
          MG=lib/ModernGekko/build
          DEST=build/artifact/PokemonColosseumRecomp
          mkdir -p "$DEST"

          cp "$MG/PokemonColosseumRecomp${{ matrix.exe }}" "$DEST/"
          cp "$MG/moderngekko-run${{ matrix.exe }}" "$DEST/"
          cp -R "$MG/Sys" "$DEST/"
          cp -R "$MG/patches" "$DEST/"
          cp LICENSE THIRD_PARTY_NOTICES.md VERSION README.md CHANGELOG.md SECURITY.md SOURCE.md "$DEST/"
          {
            git rev-parse HEAD
            git submodule status --recursive
          } > "$DEST/SOURCE_REVISIONS.txt"
          mkdir -p "$DEST/licenses/ModernGekko" "$DEST/licenses/DolRecomp" "$DEST/licenses/Dolphin"
          cp lib/ModernGekko/LICENSE "$DEST/licenses/ModernGekko/"
          cp lib/DolRecomp/LICENSE "$DEST/licenses/DolRecomp/"
          cp lib/ModernGekko/vendor/dolphin/COPYING "$DEST/licenses/Dolphin/"
          cp -R lib/ModernGekko/vendor/dolphin/LICENSES "$DEST/licenses/Dolphin/"
          cp -R packaging/licenses/Roboto "$DEST/licenses/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/collect-third-party-notices.py \
              lib/ModernGekko/vendor/dolphin/Externals "$DEST/licenses/Dolphin/Externals"
          else
            python3 scripts/collect-third-party-notices.py \
              lib/ModernGekko/vendor/dolphin/Externals "$DEST/licenses/Dolphin/Externals"
          fi

          # Optional mods, each carrying the canonical host-patch payload so a
          # generated package can never ship stale renderer patches. The
          # follower Pokemon is on by default: it goes in Mods/, which always
          # loads.
          mkdir -p "$DEST/Mods/Optional"
          for pkg in build/mods/packages/*.mgm; do
            name=$(basename "$pkg")
            dir="$DEST/Mods/Optional/$name"
            [ "$name" = pokemon-colosseum-follower.mgm ] && dir="$DEST/Mods/$name"
            mkdir -p "$dir"
            cp "$pkg/${{ matrix.modlib }}" "$dir/"
            cp -R mods/host-patches "$dir/"
          done

          # Tools: what the launcher needs to build the game module from the
          # player's own disc (it downloads the compiler itself): the port tool
          # and DolRecomp, the runtime sources compiled into every module, and
          # this game's patch lists. No game data and no generated code.
          TOOLS="$DEST/Tools"
          MS="$TOOLS/ModuleSource/vendor/dolphin"
          VD=lib/ModernGekko/vendor/dolphin
          mkdir -p "$TOOLS" "$MS/GXRuntime/src" "$MS/Source/Core/Core/PowerPC" \
                   "$MS/Data/Sys/GameSettings"
          cp "$MG/moderngekko-port${{ matrix.exe }}" "$MG/dolrecomp${{ matrix.exe }}" "$TOOLS/"
          cp -R "$VD/module-template" "$MS/module-template"
          rm -rf "$MS/module-template/generated"
          cp -R "$VD/GXRuntime/include" "$MS/GXRuntime/include"
          cp -R "$VD/GXRuntime/src/core" "$MS/GXRuntime/src/core"
          cp -R "$VD/Source/Core/Core/PowerPC/StaticRecomp" "$MS/Source/Core/Core/PowerPC/StaticRecomp"
          cp "$VD/Data/Sys/GameSettings/GC6E01.ini" "$MS/Data/Sys/GameSettings/"
          cp patches/GC6E01-native-widescreen.csv patches/GC6E01-native-substitutions.csv "$TOOLS/"
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          "$PY" scripts/make-module-hook-list.py --functions patches/GC6E01-functions.csv \
            --mods mods --output "$TOOLS/GC6E01-module-hooks.txt"

          # macOS: PokemonColosseumRecomp.app next to the launcher it starts,
          # so macOS can ask for Local Network access (packaging/macos).
          if [ "$RUNNER_OS" = "macOS" ]; then
            sh packaging/macos/make-app.sh "$DEST" "$(tr -d '\r\n' < VERSION)"
          fi

          # Empty runtime scaffolding; no savestates, memory cards or configs.
          mkdir -p "$DEST/User/Config" "$DEST/User/GameSettings" \
                   "$DEST/User/StateSaves" "$DEST/User/GC" "$DEST/User/Dump" \
                   "$DEST/User/Logs" "$DEST/User/ResourcePacks" "$DEST/User/Wii"

      - name: Verify package carries no personal data
        shell: bash
        run: |
          set -eu
          DEST=build/artifact/PokemonColosseumRecomp
          fail=0
          # Savestates, memory cards, dev harness and the local game pointer
          # must never reach an artifact.
          if find "$DEST" -type l | grep -q .; then
            echo "::error::package contains a symlink"
            fail=1
          fi
          if find "$DEST" -type f \( -iname '*.iso' -o -iname '*.gcm' \
               -o -iname '*.ciso' -o -iname '*.rvz' -o -iname '*.nkit*' \
               -o -iname '*.dol' -o -iname '*.elf' -o -iname '*.gci' \
               -o -iname '*.raw' -o -iname '*.sav' -o -iname '*.state' \
               -o -name 'default-game.txt' -o -name '*recomp*.dll' \) | grep -q .; then
            echo "::error::package contains excluded runtime or game-derived files"
            fail=1
          fi
          # Dolphin's stock Sys/Resources contains launcher icons; image files
          # in the user or mod trees would be unexpected game/texture payloads.
          if find "$DEST/User" "$DEST/Mods" -type f \( \
               -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \
               -o -iname '*.dds' -o -iname '*.ktx' -o -iname '*.ktx2' \) | grep -q .; then
            echo "::error::package contains unexpected user or mod image data"
            fail=1
          fi
          # A self-hosted runner builds under its owner's account, so also
          # reject that account's home path. The workspace itself must not
          # appear either: the path-trimming flags above remove it from
          # __FILE__, so a hit here means the trim stopped applying.
          owner="${USER:-${USERNAME:-}}"
          ws="$GITHUB_WORKSPACE"
          ws_fwd="$ws"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ws=$(cygpath -w "$GITHUB_WORKSPACE")
            ws_fwd=$(cygpath -m "$GITHUB_WORKSPACE")
          fi
          if grep -rl 'runneradmin\|/Users/runner/work' "$DEST" 2>/dev/null | grep -q . ||
             grep -rliF -e "$ws" -e "$ws_fwd" "$DEST" 2>/dev/null | grep -q . ||
             { [ -n "$owner" ] && grep -rlF -e "/home/$owner/" -e "/Users/$owner/" \
                 -e "Users\\$owner\\" "$DEST" 2>/dev/null | grep -q .; }; then
            grep -rliF -e "$ws" -e "$ws_fwd" "$DEST" 2>/dev/null | head -20 || true
            echo "::error::package embeds absolute runner paths"
            fail=1
          fi
          exit $fail

      - name: Hash artifact contents
        shell: bash
        run: |
          cd build/artifact/PokemonColosseumRecomp
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PokemonColosseumRecomp-${{ matrix.label }}
          path: build/artifact/PokemonColosseumRecomp
          if-no-files-found: error
